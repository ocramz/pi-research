[project]
name = "epm-experiments"
version = "0.1.0"
description = "Stage B experiments on the Rosso pricing design note (energy-pricing-model)"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=2.0", "scipy>=1.13"]

[dependency-groups]
dev = ["pytest>=8.0", "hypothesis>=6.100"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "epmlib"
module-root = "lib/python"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not live'"
markers = ["live: needs network or API keys; never part of `uv run pytest`"]
filterwarnings = ["error::RuntimeWarning"]
